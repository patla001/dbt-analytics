models:
  - name: dim_customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: first_name
        data_tests:
          - not_null
      - name: last_name
        data_tests:
          - not_null
      - name: first_order_date
        description: "Date of customer's first order (null if no orders)"
      - name: most_recent_order_date
        description: "Date of customer's most recent order (null if no orders)"
      - name: number_of_orders
        data_tests:
          - not_null