version: 2

sources:
  - name: stripe
    database: raw
    schema: stripe
    tables:
      - name: payment
        config:
          freshness:
            warn_after: {count: 2800, period: day}   
            error_after: {count: 3000, period: day}
          loaded_at_field: created


