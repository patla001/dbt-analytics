sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    config:    
      freshness:
        warn_after:
          count: 2800
          period: day
        error_after:
          count: 3000
          period: day
      loaded_at_field: _etl_loaded_at
    tables:
      - name: customers
        freshness: null
      - name: orders
        loaded_at_field: timestamp(order_date)